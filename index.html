<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎒背人模拟器</title>
    <style>
        :root { --panel-width: 300px; }
        body { margin: 0; font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif; background: #ffffff; overflow: hidden; }
        /* #ui-panel 的更新 */
        #ui-panel {
            position: absolute; 
            top: 10px; 
            left: 10px; 
            width: var(--panel-width);
            max-height: calc(100vh - 20px);
            max-height: calc(100dvh - 20px); /* 适配可变视口 */
            background: rgba(255, 255, 255, 0.95); 
            padding: 15px; 
            padding-bottom: 40px; 
            border-radius: 15px; 
            z-index: 100; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
            touch-action: pan-y; 
            border: 1px solid rgba(255,255,255,0.3); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            box-sizing: border-box;
            transition: all 0.2s ease-out;
        }
        #canvas-container { width: 100vw; height: 100vh; cursor: move; touch-action: none; }

        @media screen and (max-width: 480px) { 
            :root { --panel-width: calc(100vw - 20px); }
            #ui-panel { left: 10px; right: 10px; }
        }
        
        @media screen and (orientation: landscape) and (max-height: 500px) {
            :root { --panel-width: 260px; }
            #ui-panel { top: 5px; left: 5px; padding: 10px; max-height: calc(100vh - 10px); }
            .app-title { font-size: 1.1rem; }
            .input-group { padding: 8px; margin-bottom: 5px; }
        }

        /* 折叠（收起）状态的专用样式 */
        #ui-panel.collapsed {
            max-height: none !important;
            padding: 10px 15px !important;
            overflow: hidden !important;
            width: auto;
            max-width: calc(100vw - 20px);
        }

        @media screen and (max-width: 480px) { 
            /* 手机端收起时解除右端固定，收进标题尺寸 */
            #ui-panel.collapsed { right: auto; }
        }

        /* 头部固定在面板顶部（滚动时依然吸顶） */
        .panel-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            cursor: pointer; 
            user-select: none; 
            gap: 10px; 
            position: sticky; /* 面板内滚动时同样置顶 */
            top: -15px;       /* 抵消 padding 的高度 */
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 0;
            margin: -15px -15px 10px -15px;
            padding-left: 15px;
            padding-right: 15px;
            z-index: 10;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        #toggle-text { 
            font-size: 12px; 
            font-weight: bold; 
            color: #666; 
            background: #eee; 
            padding: 4px 10px; 
            border-radius: 10px; 
            white-space: nowrap; /* 防止文本意外换行 */
        }
        .collapsed #ui-content { display: none; }

        .app-title { 
            font-size: 1.2rem; 
            margin: 0; 
            color: #333; 
            font-weight: bold; 
            white-space: nowrap; /* 防止标题换行 */
        }
        .app-description { font-size: 11px; color: #777; margin-top: 8px; margin-bottom: 5px; line-height: 1.5; text-align: center; }
        
        .app-disclaimer { 
            font-size: 9px; 
            color: #aaa; 
            margin-bottom: 12px; 
            line-height: 1.4; 
            text-align: left;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 8px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .group-a { background: #fff5f0; border: 1px solid #ffe0d0; }
        .group-b { background: #f0f7ff; border: 1px solid #d0e7ff; }
        .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        .section-header strong { font-size: 15px; color: #444; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; width: 100%; }
        .input-item { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .hint { font-size: 10px; color: #999; margin-bottom: 2px; font-weight: bold; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: white; color: #333; width: 100%; box-sizing: border-box; }
        
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        .color-picker { width: 100%; height: 38px; border: 2px solid #999; border-radius: 4px; cursor: pointer; padding: 0; background: none; appearance: none; -webkit-appearance: none; }
        
        .switch-btn { width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; -webkit-tap-highlight-color: transparent; margin-bottom: 10px; }
        .switch-btn:active { background: #000; transform: scale(0.98); }
        .swap-btn { margin-bottom: 5px; }

        .anim-controls {
            display: flex;       
            gap: 8px;            
            margin-bottom: 10px;
        }
        .btn-anim {
            flex: 1;             
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-anim.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }

        .share-btn { 
            width: 100%; padding: 12px; background: #000; color: white; border: none; border-radius: 10px; 
            font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none; margin-top: 10px;
        }
        .share-btn:active { transform: scale(0.98); opacity: 0.8; }

        .other-tools-link { margin-top: 20px; padding: 10px; background: #f9f9f9; border-radius: 10px; text-align: center; }
        .other-tools-link a { text-decoration: none; color: #333; font-size: 12px; font-weight: bold; border: 2px solid #333; padding: 8px 15px; border-radius: 30px; display: inline-block; transition: 0.3s; margin: 4px; }
        .other-tools-link a:hover { background: #333; color: #fff; }

        .usage-notes { font-size: 10px; color: #999; margin-top: 12px; line-height: 1.5; text-align: center; }

        .info-box { background: #ffffff; padding: 15px; border-radius: 12px; margin-top: 12px; border: 1px solid #eee; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .info-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }
        .info-row:not(:last-child) { border-bottom: 1px dashed #eee; margin-bottom: 4px; }
        .info-label { color: #555; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .info-value { font-weight: 800; font-size: 18px; color: #2c3e50; font-variant-numeric: tabular-nums; }
        .unit { font-size: 11px; margin-left: 3px; color: #7f8c8d; font-weight: normal; }
        
        #view-label { 
            position: absolute; 
            bottom: 20px; 
            right: 15px; 
            background: rgba(0,0,0,0.7); 
            color: white; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: bold; 
            z-index: 90; 
            pointer-events: none; 
        }
        .crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid rgba(0,0,0,0.15); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    </style>
</head>
<body>

<div id="ui-panel">
    <div class="panel-header" onclick="togglePanel()">
        <h1 class="app-title">🎒背人模拟器</h1>
        <span id="toggle-text">收起</span>
    </div>

    <div id="ui-content">
        <p class="app-description">可根据性别与身高模拟“背背”时的氛围。</p>
        
        <div class="input-group group-a">
            <div class="section-header"><strong>A</strong></div>
            <div class="input-row">
                <div class="input-item"><span class="hint">名字</span><input type="text" id="nameA" placeholder="名字A" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.6;"><span class="hint">性别</span><select id="genderA" onchange="updateScene()"><option value="male">男</option><option value="female" selected>女</option></select></div>
            </div>
            <div class="input-row">
                <div class="input-item"><span class="hint">身高 (cm)</span><input type="number" id="heightA" value="158.0" step="0.1" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.35;"><span class="hint">颜色</span><input type="color" id="colorA" class="color-picker" value="#ffcc99" oninput="updateScene()"></div>
            </div>
        </div>

        <div class="input-group group-b">
            <div class="section-header"><strong>B</strong></div>
            <div class="input-row">
                <div class="input-item"><span class="hint">名字</span><input type="text" id="nameB" placeholder="名字B" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.6;"><span class="hint">性别</span><select id="genderB" onchange="updateScene()"><option value="male" selected>男</option><option value="female">女</option></select></div>
            </div>
            <div class="input-row">
                <div class="input-item"><span class="hint">身高 (cm)</span><input type="number" id="heightB" value="171.5" step="0.1" oninput="updateScene()"></div>
                <div class="input-item" style="flex: 0.35;"><span class="hint">颜色</span><input type="color" id="colorB" class="color-picker" value="#ffad60" oninput="updateScene()"></div>
            </div>
        </div>

        <div style="padding: 0 5px;">
            <button class="switch-btn swap-btn" onclick="swapAB()">⇄ 交换 A 与 B</button>
            <button class="switch-btn" onclick="switchView()">🔄 切换视角</button>
        </div>
        
        <div id="info-container">
            <div class="info-box" id="info"></div>
            <button class="share-btn" onclick="shareToX()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg> 分享结果
            </button>
            <div class="other-tools-link">
                <p style="font-size: 10px; color: #888; margin-bottom: 8px;">顺便也看看这些❣🤩</p>
                <a href="https://fcylz.github.io/my-site-hub/">工具・模拟器合集</a>
            </div>
            <div class="usage-notes">
                截图分享、二次加工、临摹描图等都可以随意使用。<br>
                ※请勿用于营利、商业用途。
            </div>
        </div>
    </div>
</div>

<div id="view-label">第三人称视角</div>
<div class="crosshair" id="crosshair" style="display:none;"></div>
<div id="canvas-container"></div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';

let scene, camera, renderer, clock;
let personA, personB, walkGroup;
let currentView = '3rd';
const LEAN = 0.3; // 背人时的前倾角度(rad)
const AXIS_X = new THREE.Vector3(1, 0, 0);
const DEFAULT_ROT_3RD = { x: 0, y: -Math.PI / 2 }; // 第三人称初始从侧面看
let rotation = { x: DEFAULT_ROT_3RD.x, y: DEFAULT_ROT_3RD.y }, camDist = 3, isDragging = false, previousTouch = null, initialPinchDist = null;

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);

    camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
    );

    camera.rotation.order = 'YXZ';
    
    renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);

    document.getElementById('canvas-container')
        .appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 2.5));
    scene.add(new THREE.GridHelper(200, 400, 0xeeeeee, 0xf5f5f5));

    walkGroup = new THREE.Group();
    scene.add(walkGroup);

    clock = new THREE.Clock();

    setupControls();

    window.addEventListener('resize', onWindowResize);
    
    window.updateScene = updateScene;
    window.switchView = switchView;
    window.swapAB = swapAB;
    window.shareToX = shareToX;

    window.togglePanel = () => {
        const panel = document.getElementById('ui-panel');
        const text = document.getElementById('toggle-text');
        panel.classList.toggle('collapsed');
        text.innerText = panel.classList.contains('collapsed') ? '展开' : '收起';
    };

    // 输入框失焦时，把面板的滚动位置重置回顶部
    document.querySelectorAll('#ui-panel input, #ui-panel select').forEach(element => {
        element.addEventListener('blur', () => {
            const panel = document.getElementById('ui-panel');
            if (panel) {
                panel.scrollTop = 0;
            }
            // 防止 iOS Safari 等设备上整屏偏移的对策
            window.scrollTo(0, 0);
        });
    });

    updateScene();
    animate();
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function swapAB() {
    const fields = ['name', 'gender', 'height', 'color'];
    fields.forEach(field => {
        const elA = document.getElementById(field + 'A');
        const elB = document.getElementById(field + 'B');
        const tmp = elA.value;
        elA.value = elB.value;
        elB.value = tmp;
    });
    updateScene();
}

function createMannequin(color, heightCm, gender, name, role, otherConfig) {
    const group = new THREE.Group();
    const h = heightCm * 0.01;
    const bodyMat = new THREE.MeshPhongMaterial({
        color: color,
        transparent: true,
        opacity: 0.85
    });
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });

    const headH = h * 0.13;
    const neckH = h * 0.05;
    const torsoH = h * 0.37;
    const legH = h * 0.45;
    const eyeY = h * 0.94;
    const torsoW = (gender === 'male' ? 0.26 : 0.21) * (h/1.7);
    const torsoDepth = torsoW * 0.5;

    const headBox = new THREE.Group();
    headBox.position.y = eyeY;
    const head = new THREE.Mesh(new THREE.SphereGeometry(headH * 0.8, 16, 16), bodyMat);
    head.position.y = (h - headH * 0.5) - eyeY;
    headBox.add(head);

    [-1, 1].forEach(side => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(headH * 0.12, 12, 12), eyeMat);
        eye.position.set(side * (headH * 0.28), 0, (headH * 0.7));
        headBox.add(eye);
    });
    group.add(headBox);
    group.headParts = headBox;

    const neck = new THREE.Mesh(new THREE.CylinderGeometry(headH*0.3, headH*0.3, neckH, 16), bodyMat);
    neck.position.y = h - headH - (neckH * 0.5);
    group.add(neck);

    const torso = new THREE.Mesh(new THREE.BoxGeometry(torsoW, torsoH, torsoDepth), bodyMat);
    torso.position.y = legH + (torsoH * 0.5);
    group.add(torso);

    group.arms = [];
    const armThickness = torsoW * 0.3;
    const shoulderW = (torsoW * 0.5) + (armThickness * 0.5); // 考虑手臂厚度，放置在外侧
    const shoulderY = legH + torsoH - (torsoW * 0.15); 
    const armLen = h * 0.38;

    [-1, 1].forEach(side => {
        const anchor = new THREE.Group();
        anchor.position.set(side * shoulderW, shoulderY, 0);
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(armThickness, armLen, torsoW*0.3), bodyMat);
        mesh.position.y = -armLen * 0.5;
        anchor.add(mesh);
        group.add(anchor);
        group.arms.push(anchor);
    });

    group.legs = [];
    [-1, 1].forEach(side => {
        const anchor = new THREE.Group();
        anchor.position.set( side * (torsoW * 0.25), legH, 0 );
        const mesh = new THREE.Mesh(new THREE.BoxGeometry( torsoW*0.4, legH, torsoW*0.4 ), bodyMat);
        mesh.position.y = -legH * 0.5;
        anchor.add(mesh);
        group.add(anchor);
        group.legs.push(anchor);
    });

    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.font = "bold 45px sans-serif"; ctx.fillStyle = "#333"; ctx.textAlign = "center";
    const displayName = name || (role === 'B' ? 'B' : 'A');
    ctx.fillText(`${displayName} (${heightCm.toFixed(1)}cm)`, 256, 64);
    const spriteMaterial = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) });
    const sprite = new THREE.Sprite(spriteMaterial);
    sprite.scale.set(1.5, 0.38, 1);
    sprite.position.y = h + 0.3;
    group.add(sprite);
    group.nameTag = sprite;

    group.userData = { height: h, eyeY: eyeY, role: role, depth: torsoDepth, width: torsoW, armThick: armThickness, legH: legH, torsoH: torsoH, shoulderW: shoulderW, shoulderY: shoulderY };
    group.position.y = 0; group.position.z = 0;
    return group;
}

// ===== 背人用的辅助函数 =====
// 以腰为轴，让上半身（头・颈・躯干・手臂・名字标签）前倾
function applyLean(p, angle) {
    const pivot = new THREE.Group();
    pivot.position.y = p.userData.legH;
    const upper = p.children.filter(c => !p.legs.includes(c));
    upper.forEach(c => { p.remove(c); c.position.y -= p.userData.legH; pivot.add(c); });
    pivot.rotation.x = angle;
    p.add(pivot);
    p.pivot = pivot;
}

// 把手臂・腿部的棍状物一分为二，做出关节（肘・膝）
function addJoint(anchor) {
    const mesh = anchor.children[0];
    const half = mesh.geometry.parameters.height / 2;
    mesh.scale.y = 0.5;
    mesh.position.y = -half / 2;
    const joint = new THREE.Group();
    joint.position.y = -half;
    const lower = new THREE.Mesh(mesh.geometry, mesh.material);
    lower.scale.y = 0.5;
    lower.position.y = -half / 2;
    joint.add(lower);
    anchor.add(joint);
    anchor.joint = joint;
    anchor.half = half;
}

// 把朝正下方的棍子转向 dir 的方向（旋转顺序 XYZ）
function aim(node, dir) {
    const d = dir.clone().normalize();
    node.rotation.z = Math.asin(Math.max(-1, Math.min(1, d.x)));
    node.rotation.x = Math.atan2(-d.z, -d.y);
}

// dirUpper/dirLower 为 anchor 父级坐标系中的朝向
function aimLimb(anchor, dirUpper, dirLower) {
    aim(anchor, dirUpper);
    const inv = anchor.quaternion.clone().invert();
    aim(anchor.joint, dirLower.clone().applyQuaternion(inv));
}

// 双关节 IK：返回从肩 S 到手 T 的肘位置 E（pole 为肘部弯曲方向）
function solveTwoBone(S, T, l1, l2, pole) {
    const v = T.clone().sub(S);
    let d = v.length();
    const maxD = (l1 + l2) * 0.999;
    if (d > maxD) { v.setLength(maxD); d = maxD; }
    if (d < 0.02) { v.set(0, -0.02, 0); d = 0.02; }
    const dir = v.clone().normalize();
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const p = pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir)));
    if (p.lengthSq() < 1e-6) p.set(0, 0, 1);
    p.normalize();
    const E = S.clone().add(dir.clone().multiplyScalar(a)).add(p.multiplyScalar(h));
    const H = S.clone().add(v);
    return { E, H };
}

// 世界方向 → 前倾上半身(pivot) 的局部方向
function toLocal(v) {
    return v.clone().applyAxisAngle(AXIS_X, -LEAN);
}

// B 背 A 的姿势（A＝被背的人 / B＝背人的人）
function setupPiggyback(A, B) {
    const a = A.userData, b = B.userData;

    applyLean(B, LEAN);
    applyLean(A, LEAN);
    B.arms.forEach(arm => addJoint(arm));
    A.arms.forEach(arm => addJoint(arm));
    A.legs.forEach(leg => addJoint(leg));

    // A 的臀部位置 P：从 B 的腰部出发，使躯干紧贴 B 的背部
    const hipB = new THREE.Vector3(0, b.legH, 0);
    const yA = 0.07 * b.height;
    const zA = -(b.depth / 2 + a.depth / 2 + 0.005);
    const P = hipB.clone().add(new THREE.Vector3(0, yA, zA).applyAxisAngle(AXIS_X, LEAN));
    A.position.set(0, P.y - a.legH, P.z);

    // 调整名字标签的位置
    A.nameTag.position.y += 0.45;

    // 调整 A 头部的位置：放到自然的位置
    A.headParts.position.x = 0;
    A.headParts.position.z = -0.02;

    // A 的腿：像夹住 B 的腰一样向前张开（膝盖弯曲，小腿向下）
    const halfLegA = A.legs[0].half;
    const hipX = a.width * 0.25;
    const legThick = a.width * 0.4;
    const xT = b.width / 2 + legThick / 2 + 0.03;
    const abd = Math.asin(Math.min(0.9, Math.max(0.15, (xT - hipX) / halfLegA)));
    let fwd = 1.0;
    const legDirs = (s, f) => {
        const up = new THREE.Vector3(s * Math.sin(abd), -Math.cos(abd) * Math.cos(f), Math.cos(abd) * Math.sin(f)).normalize();
        const lo = new THREE.Vector3(-s * 0.05, -1, -0.25).normalize();
        return [up, lo];
    };
    for (let i = 0; i < 12; i++) { // 若脚陷进地面，就让大腿更靠前
        const [u, l] = legDirs(1, fwd);
        const footY = P.y + (u.y + l.y) * halfLegA;
        if (footY >= 0.03 || fwd >= 1.45) break;
        fwd += 0.05;
    }
    A.legs.forEach((leg, i) => {
        const s = i === 0 ? -1 : 1;
        const [u, l] = legDirs(s, fwd);
        aimLimb(leg, u, l);
    });

    // B 的手臂：从后方绕手与前臂，放到“从下方包住 A 大腿后侧・膝窝直接抓住”的位置
    B.arms.forEach((arm, i) => {
        const s = i === 0 ? -1 : 1;
        const [u] = legDirs(s, fwd);
        // 到達点(T)：把手牢牢绕到大腿中部到膝窝的下侧
        const thighPos = P.clone()
            .add(new THREE.Vector3(s * (hipX + legThick * 0.3), 0, 0))
            .add(u.clone().multiplyScalar(halfLegA * 0.7));

        const T = thighPos.add(new THREE.Vector3(s * 0.02, -0.05, 0.02));
        const S = hipB.clone().add(new THREE.Vector3(s * b.shoulderW, b.shoulderY - b.legH, 0).applyAxisAngle(AXIS_X, LEAN));
        
        // 肘部向后・向外张开，稳稳从下方托起大腿的关节弯曲方式
        const { E, H } = solveTwoBone(S, T, arm.half, arm.half, new THREE.Vector3(s * 0.9, -0.4, -0.3));
        aimLimb(arm, toLocal(E.clone().sub(S)), toLocal(H.clone().sub(E)));
    });

    // A 的手臂：越过 B 的肩膀，自然地把手绕到前襟・胸口的姿势
    A.arms.forEach((arm, i) => {
        const s = i === 0 ? -1 : 1;
        const S = P.clone().add(new THREE.Vector3(s * a.shoulderW, a.shoulderY - a.legH, 0).applyAxisAngle(AXIS_X, LEAN));
        const T = hipB.clone().add(new THREE.Vector3(s * b.width * 0.22, b.torsoH * 0.65, b.depth / 2 + 0.08).applyAxisAngle(AXIS_X, LEAN));
        const { E, H } = solveTwoBone(S, T, arm.half, arm.half, new THREE.Vector3(s * 0.5, 0.8, 0.6));
        aimLimb(arm, toLocal(E.clone().sub(S)), toLocal(H.clone().sub(E)));
    });
}

function updateScene() {
    const hA = parseFloat(document.getElementById('heightA').value)||158;
    const hB = parseFloat(document.getElementById('heightB').value)||171.5;
    const gA = document.getElementById('genderA').value;
    const gB = document.getElementById('genderB').value;
    
    if(personA) walkGroup.remove(personA);
    if(personB) walkGroup.remove(personB);
    
    personA = createMannequin(document.getElementById('colorA').value, hA, gA, document.getElementById('nameA').value, 'A', {});
    personB = createMannequin(document.getElementById('colorB').value, hB, gB, document.getElementById('nameB').value, 'B', {});
    
    setupPiggyback(personA, personB);

    walkGroup.add(personA, personB);
    const nA = document.getElementById('nameA').value||'A';
    const nB = document.getElementById('nameB').value||'B';

    if(currentView !== '3rd') {
        const myName = (currentView === 'A') ? nA : nB;
        document.getElementById('view-label').innerText = `${myName} 的视角`;
        if(currentView === 'A') { personA.headParts.visible = false; personA.nameTag.visible = false; }
        if(currentView === 'B') { personB.headParts.visible = false; personB.nameTag.visible = false; }
    }

    document.getElementById('info').innerHTML = `
        <div class="info-row">
            <span class="info-label">📏 身高差</span>
            <span class="info-value">${Math.abs(hA-hB).toFixed(1)}<span class="unit">cm</span></span>
        </div>
    `;
}

function animate() {
    requestAnimationFrame(animate);

    // 抵消前倾、正面朝前的自然头部朝向
    personB.headParts.rotation.set(-LEAN + 0.05, 0, 0);
    personA.headParts.rotation.set(-LEAN + 0.1, 0, 0);

    const centerPos = new THREE.Vector3(0, Math.max(personA.userData.height, personB.userData.height) * 0.5, 0);

    if (currentView === '3rd') {
        camera.up.set(0, 1, 0);
        camera.position.set(
            centerPos.x + Math.sin(rotation.y) * camDist,
            centerPos.y + Math.sin(rotation.x) * camDist,
            centerPos.z + Math.cos(rotation.y) * camDist
        );
        camera.lookAt(centerPos);
    } else {
        const self = (currentView === 'A' ? personA : personB);
        camera.up.set(0, 1, 0);
        self.headParts.getWorldPosition(camera.position);
        camera.lookAt(camera.position.clone().add(new THREE.Vector3(0, 0, 1)));

        camera.rotateY(rotation.y);
        camera.rotateX(rotation.x);
        camera.rotation.z = 0; 
    }
    renderer.render(scene, camera);
}

function setupControls() {
    const c = document.getElementById('canvas-container');
    const move = (dx, dy) => { rotation.y -= dx * 0.005; rotation.x -= dy * 0.005; };
    c.addEventListener('mousedown', () => isDragging = true);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => { if(isDragging) move(e.movementX, e.movementY); });

    c.addEventListener('wheel', e => {
        if (currentView === '3rd') {
            camDist += e.deltaY * 0.002;
            camDist = Math.max(0.5, Math.min(10, camDist));
        }
    }, { passive: true });

    c.addEventListener('touchstart', e => { 
        if (e.touches.length === 1) {
            isDragging = true; 
            previousTouch = e.touches[0]; 
            initialPinchDist = null;
        } else if (e.touches.length === 2 && currentView === '3rd') {
            isDragging = false;
            initialPinchDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
        }
    }, { passive: false });

    window.addEventListener('touchend', () => { 
        isDragging = false; 
        initialPinchDist = null;
    });

    window.addEventListener('touchmove', e => {
        if (e.touches.length === 1 && isDragging && previousTouch) {
            if (e.cancelable) e.preventDefault();
            const touch = e.touches[0];
            move(touch.clientX - previousTouch.clientX, touch.clientY - previousTouch.clientY);
            previousTouch = touch;
        } else if (e.touches.length === 2 && initialPinchDist !== null && currentView === '3rd') {
            if (e.cancelable) e.preventDefault();
            const currentDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            const diff = currentDist - initialPinchDist;
            camDist -= diff * 0.005;
            camDist = Math.max(0.5, Math.min(10, camDist));
            initialPinchDist = currentDist;
        }
    }, { passive: false });
}

function switchView() {
    const order = ['3rd', 'A', 'B'];
    currentView = order[(order.indexOf(currentView) + 1) % 3];
    const nA = document.getElementById('nameA').value||'A';
    const nB = document.getElementById('nameB').value||'B';
    
    if (currentView === '3rd') {
        document.getElementById('view-label').innerText = '第三人称视角';
    } else {
        const myName = (currentView === 'A') ? nA : nB;
        document.getElementById('view-label').innerText = `${myName} 的视角`;
    }

    document.getElementById('crosshair').style.display = currentView === '3rd' ? 'none' : 'block';
    personA.headParts.visible = true; personA.nameTag.visible = true;
    personB.headParts.visible = true; personB.nameTag.visible = true;
    if (currentView === 'A') { personA.headParts.visible = false; personA.nameTag.visible = false; }
    else if (currentView === 'B') { personB.headParts.visible = false; personB.nameTag.visible = false; }
    if (currentView === '3rd') { rotation.x = DEFAULT_ROT_3RD.x; rotation.y = DEFAULT_ROT_3RD.y; }
    else { rotation.x = 0; rotation.y = 0; }
}

function shareToX() {
    const nA = document.getElementById('nameA').value || 'A';
    const nB = document.getElementById('nameB').value || 'B';
    const hA = parseFloat(document.getElementById('heightA').value) || 158.0;
    const hB = parseFloat(document.getElementById('heightB').value) || 171.5;
    const text = `${nB}（${hB.toFixed(1)}cm）背着 ${nA}（${hA.toFixed(1)}cm）！\n#背人模拟器\n`;
    window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`, '_blank');
}

init();
</script>


<script>
/* 设置持久化 v2：本页控件刷新保留，名字・性别・身高・颜色跨模式通用 */
(function () {
  var PAGE_KEY = 'simSettings:' + location.pathname;
  var PROFILE_KEY = 'simProfileV1';
  var SKIP = { seek: 1, pVol: 1 };
  var restoring = false;
  var dirtyEls = [];
  var timer = null;

  function list() {
    var els = document.querySelectorAll('input,select,textarea'), out = [], i, el;
    for (i = 0; i < els.length; i++) {
      el = els[i];
      if (el.type === 'file' || el.type === 'button' || el.type === 'submit' || el.type === 'reset') continue;
      if (el.id && SKIP[el.id]) continue;
      out.push(el);
    }
    return out;
  }
  function classIndex(el, cn) {
    var sibs = document.querySelectorAll(el.tagName.toLowerCase() + '[class~="' + cn + '"]'), i;
    for (i = 0; i < sibs.length; i++) if (sibs[i] === el) return i;
    return -1;
  }
  function keyOf(el) {
    if (el.id) return 'id:' + el.id;
    var cn = (el.className || '').split(/\s+/)[0];
    if (!cn) return null;
    var idx = classIndex(el, cn);
    return idx < 0 ? null : 'cls:' + cn + ':' + idx;
  }
  /* 名字・性别・身高・角色颜色 → 共享档案的 A / B 槽位 */
  function slotOf(el) {
    var m, cn, idx;
    if (el.id) {
      if (/^name(Input)?A$/i.test(el.id)) return ['A', 'name'];
      if (/^name(Input)?B$/i.test(el.id)) return ['B', 'name'];
      m = /^(gender|height|color)([AB])$/i.exec(el.id);
      if (m) return [m[2].toUpperCase(), m[1].toLowerCase()];
      return null;
    }
    cn = (el.className || '').split(/\s+/)[0];
    m = /^(name|gender|height|color)-input$/.exec(cn);
    if (!m) return null;
    idx = classIndex(el, cn);
    if (idx === 0) return ['A', m[1]];
    if (idx === 1) return ['B', m[1]];
    return null;
  }
  function get(el) {
    return (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value;
  }
  function set(el, v) {
    var i, ok;
    if (el.tagName === 'SELECT') {
      ok = false;
      for (i = 0; i < el.options.length; i++) if (el.options[i].value === v) ok = true;
      if (!ok) return;
    }
    if (el.type === 'checkbox' || el.type === 'radio') el.checked = !!v;
    else el.value = v;
  }
  function fire(el, type) {
    try { el.dispatchEvent(new Event(type, { bubbles: true })); } catch (e) {}
  }
  function readJSON(key) {
    try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; }
  }
  function writeJSON(key, data) {
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
  }

  function applyProfile(prof) {
    if (!prof) return;
    var els = list(), i, s;
    restoring = true;
    for (i = 0; i < els.length; i++) {
      s = slotOf(els[i]);
      if (s && prof[s[0]] && prof[s[0]][s[1]] !== undefined) set(els[i], prof[s[0]][s[1]]);
    }
    for (i = 0; i < els.length; i++) { fire(els[i], 'input'); fire(els[i], 'change'); }
    restoring = false;
    for (i = 0; i < els.length; i++) {
      s = slotOf(els[i]);
      if (s && prof[s[0]] && prof[s[0]][s[1]] !== undefined) set(els[i], prof[s[0]][s[1]]);
    }
  }

  function restore() {
    var els = list(), page = readJSON(PAGE_KEY) || {}, prof = readJSON(PROFILE_KEY) || {}, i, k, s;
    restoring = true;
    for (i = 0; i < els.length; i++) { k = keyOf(els[i]); if (k && page[k] !== undefined) set(els[i], page[k]); }
    for (i = 0; i < els.length; i++) {
      s = slotOf(els[i]);
      if (s && prof[s[0]] && prof[s[0]][s[1]] !== undefined) set(els[i], prof[s[0]][s[1]]);
    }
    for (i = 0; i < els.length; i++) { fire(els[i], 'input'); fire(els[i], 'change'); }
    restoring = false;
    /* 联动控件（如身高→手长、手长→身高）可能在派发事件时改值，这里再校正一次 */
    for (i = 0; i < els.length; i++) { k = keyOf(els[i]); if (k && page[k] !== undefined) set(els[i], page[k]); }
    for (i = 0; i < els.length; i++) {
      s = slotOf(els[i]);
      if (s && prof[s[0]] && prof[s[0]][s[1]] !== undefined) set(els[i], prof[s[0]][s[1]]);
    }
  }

  function flush() {
    var els = list(), page = {}, prof = readJSON(PROFILE_KEY) || {}, i, k, s, changed = false;
    for (i = 0; i < els.length; i++) { k = keyOf(els[i]); if (k) page[k] = get(els[i]); }
    writeJSON(PAGE_KEY, page);
    /* 只把本次真正改过的字段写进共享档案，避免用本页默认值覆盖别处设置 */
    for (i = 0; i < dirtyEls.length; i++) {
      s = slotOf(dirtyEls[i]);
      if (!s || !s[0]) continue;
      prof[s[0]] = prof[s[0]] || {};
      prof[s[0]][s[1]] = get(dirtyEls[i]);
      changed = true;
    }
    dirtyEls = [];
    if (changed) writeJSON(PROFILE_KEY, prof);
  }
  function queueSave(el) {
    if (restoring) return;
    if (el && el.tagName && dirtyEls.indexOf(el) < 0) dirtyEls.push(el);
    if (timer) clearTimeout(timer);
    timer = setTimeout(flush, 200);
  }

  document.addEventListener('input', function (e) { queueSave(e.target); }, true);
  document.addEventListener('change', function (e) { queueSave(e.target); }, true);
  window.addEventListener('load', restore);
  window.addEventListener('storage', function (e) {
    if (e.key === PROFILE_KEY) applyProfile(readJSON(PROFILE_KEY));
  });
  window.__simSettings = {
    clear: function () { try { localStorage.removeItem(PAGE_KEY); } catch (e) {} },
    clearProfile: function () { try { localStorage.removeItem(PROFILE_KEY); } catch (e) {} }
  };
})();
</script>
